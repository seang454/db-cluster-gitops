apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: user-db-clusters
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/seang454/db-cluster-gitops.git
        revision: master
        directories:
          - path: db-cluster/users/*/*/*

  # Prevent stuck finalizer issue you just faced
  syncPolicy:
    preserveResourcesOnDeletion: false   # ← deletes K8s resources when app is deleted

  template:
    metadata:
      name: '{{path[3]}}-{{path.basename}}-db-cluster'
      finalizers:
        - resources-finalizer.argocd.argoproj.io  # ← use simple finalizer, not foreground
    spec:
      project: default

      sources:
        - repoURL: https://github.com/seang454/db-cluster-gitops.git
          targetRevision: master
          ref: uservalues

        - repoURL: https://github.com/seang454/ab-cluster.git
          targetRevision: master
          path: db-cluster
          helm:
            releaseName: '{{path.basename}}'
            valueFiles:
              - $uservalues/{{path}}/values.yaml

      destination:
        name: k8s-cluster2
        namespace: '{{path[3]}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground  # ← clean deletion order
          - PruneLast=true                     # ← prune after all resources sync
