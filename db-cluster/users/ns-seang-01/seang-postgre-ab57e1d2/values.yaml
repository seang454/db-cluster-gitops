global:
  clusterIdentity: seang-postgre-ab57e1d2
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - postgres-db.seang.shop
  cluster:
    bootstrap:
      database: appdb
      owner: appuser
  credentials:
    admin: PostgresStrongPassword123!
    superuser: PostgresStrongPassword123!
  backup:
    enabled: true
    s3Credentials:
      accessKeyId:
        secretName: minio-credentials-db-seang-postgres
        key: root-user
      secretAccessKey:
        secretName: minio-credentials-db-seang-postgres
        key: root-password
    schedule:
      immediate: false
      cron: 0 0 2 * * *
