global:
  clusterIdentity: seang-postgre-85e4ef91
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - postgres-db.seang.shop
  tls:
    enabled: true
    mode: operator
  cluster:
    instances: 1
    bootstrap:
      database: appdb
      owner: appuser
  credentials:
    superuser: PostgresStrongPassword123!
    admin: PostgresStrongPassword123!
  backup:
    enabled: true
    s3Credentials:
      accessKeyId:
        secretName: minio-credentials-seang-postgre-85e4ef91
        key: root-user
      secretAccessKey:
        secretName: minio-credentials-seang-postgre-85e4ef91
        key: root-password
    schedule:
      cron: 0 0 2 * * *
      immediate: false
