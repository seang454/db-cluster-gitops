global:
  clusterIdentity: seang-postgre-7146a41b
externalTcpProxy:
  ports:
    postgresql: 15433
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - postgres-db.seang.shop
  tls:
    enabled: true
    mode: operator
  cluster:
    bootstrap:
      database: appdb
      owner: appuser
  credentials:
    admin: PostgresStrongPassword123!
    superuser: PostgresStrongPassword123!
  backup:
    enabled: true
    s3Credentials:
      accessKeyId:
        key: root-user
        secretName: minio-credentials-seang-postgre-7146a41b
      secretAccessKey:
        key: root-password
        secretName: minio-credentials-seang-postgre-7146a41b
    schedule:
      immediate: false
      cron: 0 0 2 * * *
