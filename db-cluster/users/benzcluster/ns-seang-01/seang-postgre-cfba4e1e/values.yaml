global:
  clusterIdentity: seang-postgre-cfba4e1e
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - postgres-db.seang.shop
  cluster:
    instances: 2
    bootstrap:
      database: appdb
      owner: appuser
  credentials:
    superuser: PostgresStrongPassword123!
    admin: PostgresStrongPassword123!
  backup:
    enabled: true
    s3Credentials:
      accessKeyId:
        key: root-user
        secretName: minio-credentials-seang-postgre-cfba4e1e
      secretAccessKey:
        key: root-password
        secretName: minio-credentials-seang-postgre-cfba4e1e
    schedule:
      cron: 0 0 2 * * *
      immediate: false
