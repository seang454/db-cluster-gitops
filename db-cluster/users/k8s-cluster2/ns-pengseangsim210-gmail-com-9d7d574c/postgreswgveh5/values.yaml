global:
  clusterIdentity: postgreswgveh5
gateway:
  enabled: true
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - postgres-db.seang.shop
  tls:
    enabled: true
    mode: operator
  cluster:
    bootstrap:
      database: appdb
      owner: app_postgrest
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: 750m
        memory: 2Gi
  storage:
    size: 4Gi
  externalSecretRef: postgreswgveh5-postgresql-app
  superuserExternalSecretRef: postgreswgveh5-postgresql-credentials
