apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: seang-tcp
  namespace: ns-pengseangsim210-gmail-com-9d7d574c
spec:
  entryPoints:
  - mongodb
  routes:
  - match: HostSNI(`seang-0.seang.shop`)
    services:
    - name: seang-mongodb-rs0-0
      port: 27017
  - match: HostSNI(`seang-1.seang.shop`)
    services:
    - name: seang-mongodb-rs0-1
      port: 27017
  - match: HostSNI(`seang-2.seang.shop`)
    services:
    - name: seang-mongodb-rs0-2
      port: 27017
  tls:
    passthrough: true
