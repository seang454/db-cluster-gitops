global:
  clusterIdentity: seang
gateway:
  enabled: true
redis:
  enabled: true
  externalAccess:
    publicHostnames:
    - seang-redis-leader-0.seang.shop
    - seang-redis-leader-1.seang.shop
    - seang-redis-leader-2.seang.shop
    redisClusterDomainSuffix: seang.shop
  storage:
    size: 3Gi
  cluster:
    image: redis:7.2-alpine
    instances: 3
    leaderReplicas: 3
    followerReplicas: 0
    bootstrapSlots:
      enabled: true
    resources:
      requests:
        cpu: 75m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
  externalSecretRef: seang-redis-credentials
