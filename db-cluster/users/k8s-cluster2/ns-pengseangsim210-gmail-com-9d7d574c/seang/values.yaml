global:
  clusterIdentity: seang
gateway:
  enabled: true
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - seang.seang.shop
  tls:
    enabled: true
    mode: operator
  cluster:
    bootstrap:
      database: mydb
      owner: app_seang
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  storage:
    size: 5Gi
  pooler:
    enabled: true
  externalSecretRef: seang-postgresql-app
  superuserExternalSecretRef: seang-postgresql-credentials
