global:
  clusterIdentity: seang
gateway:
  enabled: true
mongodb:
  enabled: true
  unsafeFlags:
    replsetSize: true
  externalAccess:
    enabled: true
    publicHostnames:
    - seang-0.seang.shop
    - seang-1.seang.shop
    - seang-2.seang.shop
    - seang-3.seang.shop
    replicaSetHorizons:
      enabled: true
      basePort: 17017
  tls:
    enabled: true
    mode: certManager
  cluster:
    image: percona/percona-server-mongodb:8.0
    instances: 4
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: 600m
        memory: 1536Mi
  storage:
    size: 4Gi
  externalSecretRef: seang-mongodb-credentials
