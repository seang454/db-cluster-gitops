global:
  clusterIdentity: seang
gateway:
  enabled: true
cassandra:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - seang.seang.shop
  tls:
    enabled: true
    clientEncryption: true
  storage:
    size: 4Gi
  cluster:
    image: k8ssandra/cass-management-api:5.0.5-ubi
    serverVersion: 5.0.5
    config:
      clusterName: seang
      datacenter: dc1
    resources:
      requests:
        cpu: 300m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    probes:
      readinessInitialDelaySeconds: 300
      readinessTimeoutSeconds: 20
      livenessInitialDelaySeconds: 600
      livenessTimeoutSeconds: 20
      startupDelaySeconds: 900
  externalSecretRef: seang-cassandra-credentials
