global:
  clusterIdentity: seang-clone
gateway:
  enabled: true
cassandra:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - seang-clone.seang.shop
  tls:
    enabled: true
    clientEncryption: true
  storage:
    size: 4Gi
  cluster:
    image: k8ssandra/cass-management-api:4.1.3
    serverVersion: 4.1.3
    instances: 3
    config:
      clusterName: seang
      datacenter: dc1
    resources:
      requests:
        cpu: 300m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    probes:
      readinessInitialDelaySeconds: 300
      readinessTimeoutSeconds: 20
      livenessInitialDelaySeconds: 600
      livenessTimeoutSeconds: 20
      startupDelaySeconds: 900
  externalSecretRef: cassandrauetgro-cassandra-credentials
