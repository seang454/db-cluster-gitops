global:
  clusterIdentity: java
gateway:
  enabled: true
cassandra:
  enabled: true
  externalAccess:
    publicHostnames:
    - java.seang.shop
  storage:
    size: 4Gi
  cluster:
    image: k8ssandra/cass-management-api:4.1
    serverVersion: 4.1.3
    instances: 3
    config:
      clusterName: java
      datacenter: dc1
      requireClientAuth: false
      jvmOptions:
        heap_initial_size: 768M
        heap_max_size: 1024M
    resources:
      requests:
        cpu: 300m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    probes:
      readinessInitialDelaySeconds: 300
      readinessTimeoutSeconds: 20
      livenessInitialDelaySeconds: 600
      livenessTimeoutSeconds: 20
      startupDelaySeconds: 900
  externalSecretRef: java-cassandra-credentials
