global:
  clusterIdentity: my-postgres
gateway:
  enabled: true
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - postgres.seang.shop
  tls:
    enabled: true
    mode: operator
  cluster:
    bootstrap:
      database: appdb
      owner: app_my_postgres
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  storage:
    size: 10Gi
  externalSecretRef: my-postgres-postgresql-app
  superuserExternalSecretRef: my-postgres-postgresql-credentials
