global:
  clusterIdentity: postgresp6o40j
gateway:
  enabled: true
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - postgrest.seang.shop
  tls:
    enabled: true
    mode: operator
  cluster:
    bootstrap:
      database: appdb
      owner: app_postgrest
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: 750m
        memory: 2Gi
  storage:
    size: 4Gi
  externalSecretRef: postgresp6o40j-postgresql-app
  superuserExternalSecretRef: postgresp6o40j-postgresql-credentials
