global:
  clusterIdentity: cassandraremnfe
gateway:
  enabled: true
cassandra:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - seang-clone.seang.shop
  tls:
    enabled: true
    clientEncryption: true
  storage:
    size: 4Gi
  connection:
    keyspace: seang_keyspace
    username: app_seang
  cluster:
    image: k8ssandra/cass-management-api:5.0.5-ubi
    serverVersion: 5.0.5
    resources:
      requests:
        cpu: 300m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    probes:
      readinessInitialDelaySeconds: 300
      readinessTimeoutSeconds: 20
      livenessInitialDelaySeconds: 600
      livenessTimeoutSeconds: 20
      startupDelaySeconds: 900
  externalSecretRef: cassandraremnfe-cassandra-credentials
