global:
  clusterIdentity: postgreswdhttz
gateway:
  enabled: true
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - posgrest.seang.shop
  tls:
    enabled: true
    mode: operator
  cluster:
    bootstrap:
      database: posgrest
      owner: app_posgrest
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: 750m
        memory: 2Gi
  storage:
    size: 4Gi
  externalSecretRef: postgreswdhttz-postgresql-app
  superuserExternalSecretRef: postgreswdhttz-postgresql-credentials
