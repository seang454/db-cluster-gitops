global:
  clusterIdentity: postgresijqowx
gateway:
  enabled: true
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - postgrest.seang.shop
  tls:
    enabled: true
    mode: operator
  cluster:
    bootstrap:
      database: posgrest
      owner: app_my_project
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: 750m
        memory: 2Gi
  storage:
    size: 4Gi
  externalSecretRef: postgresijqowx-postgresql-app
  superuserExternalSecretRef: postgresijqowx-postgresql-credentials
