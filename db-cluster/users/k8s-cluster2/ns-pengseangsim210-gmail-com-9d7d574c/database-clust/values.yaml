global:
  clusterIdentity: database-clust
gateway:
  enabled: true
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - database-cluster.seang.shop
  tls:
    enabled: true
    mode: operator
  cluster:
    bootstrap:
      database: appdb
      owner: app_database_cluster
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  storage:
    size: 10Gi
  pooler:
    enabled: true
  externalSecretRef: database-clust-postgresql-app
  superuserExternalSecretRef: database-clust-postgresql-credentials
