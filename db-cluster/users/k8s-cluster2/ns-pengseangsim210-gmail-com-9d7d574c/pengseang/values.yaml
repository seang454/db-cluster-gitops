global:
  clusterIdentity: pengseang
gateway:
  enabled: true
postgresql:
  enabled: true
  externalAccess:
    publicHostnames:
    - pengseang.seang.shop
  cluster:
    imageName: ghcr.io/cloudnative-pg/postgresql:17
    instances: 3
    bootstrap:
      database: appdb
      owner: app_pengseang
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
  storage:
    size: 4Gi
    wal:
      enabled: false
  pooler:
    enabled: true
  externalSecretRef: pengseang-postgresql-app
  superuserExternalSecretRef: pengseang-postgresql-credentials
