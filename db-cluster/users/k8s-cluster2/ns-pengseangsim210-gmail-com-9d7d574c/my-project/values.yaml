global:
  clusterIdentity: my-project
gateway:
  enabled: true
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - postgres-db.seang.shop
  tls:
    enabled: true
    mode: operator
  cluster:
    bootstrap:
      database: seang
      owner: app_my_project
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  storage:
    size: 10Gi
  externalSecretRef: my-project-postgresql-app
  superuserExternalSecretRef: my-project-postgresql-credentials
