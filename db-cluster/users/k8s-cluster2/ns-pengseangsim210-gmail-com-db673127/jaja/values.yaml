global:
  clusterIdentity: jaja
  backupBucket: a8s-clusterdb-backup
gateway:
  enabled: true
postgresql:
  enabled: true
  externalAccess:
    publicHostnames:
    - jaja.autonomous-istad.com
  cluster:
    imageName: ghcr.io/cloudnative-pg/postgresql:17.10
    instances: 3
    bootstrap:
      database: database
      owner: app_jaja
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
  storage:
    size: 4Gi
    wal:
      enabled: false
  pooler:
    enabled: true
  externalSecretRef: jaja-postgresql-app
  superuserExternalSecretRef: jaja-postgresql-credentials
