apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: seang-tcp
  namespace: ns-pengseangsim210-gmail-com-db673127
spec:
  entryPoints:
  - redis
  routes:
  - match: HostSNI(`seang-redis-leader-0.autonomous-istad.com`)
    services:
    - name: seang-redis-leader-0
      port: 6379
  - match: HostSNI(`seang-redis-leader-1.autonomous-istad.com`)
    services:
    - name: seang-redis-leader-1
      port: 6379
  - match: HostSNI(`seang-redis-leader-2.autonomous-istad.com`)
    services:
    - name: seang-redis-leader-2
      port: 6379
  tls:
    passthrough: true
