global:
  clusterIdentity: demo-471adaa8
externalTcpProxy:
  expose:
    postgresql: true
    mongodb: false
    mysql: false
    redis: false
    cassandra: false
  ports:
    postgresql: 15438
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - demo.seang.shop
  tls:
    enabled: true
    mode: operator
  cluster:
    bootstrap:
      database: appdb
      owner: app_demo
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  storage:
    size: 10Gi
  credentials:
    superuser: qwer!@#$
    admin: qwer!@#$
