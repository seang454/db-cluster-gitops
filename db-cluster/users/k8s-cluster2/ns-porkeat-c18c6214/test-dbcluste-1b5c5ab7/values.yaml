global:
  clusterIdentity: test-dbcluste-1b5c5ab7
externalTcpProxy:
  expose:
    postgresql: true
    mongodb: false
    mysql: false
    redis: false
    cassandra: false
  ports:
    postgresql: 15435
postgresql:
  enabled: true
  externalAccess:
    enabled: true
    publicHostnames:
    - test-dbcluster.seang.shop
  tls:
    enabled: true
    mode: operator
  cluster:
    bootstrap:
      database: test
      owner: test
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  storage:
    size: 10Gi
  credentials:
    superuser: test
    admin: test
